  summary: >
    Machine Learning Researcher and Data Science student specializing in Computer Vision, Edge Devices, and Federated Learning. Experienced in building real-time inference systems with NVIDIA Jetson and ROS2.
  sections:
    Education:
      - institution: University of Tennessee Chattanooga
